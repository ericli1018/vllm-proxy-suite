volumes:
  vllm-proxy-suite:
  searxng-config:
  searxng-data:

services:
  vllm-proxy-suite:
    image: node:22-alpine
    container_name: vllm-proxy-suite
    init: true
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "3456:3456"
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      NODE_OPTIONS: "--max-old-space-size=${VLLM_PROXY_SUITE_HEAP_MB:-4096}"
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "3456"

      VLLM_PROXY_SUITE_REPOSITORY: "https://github.com/ericli1018/vllm-proxy-suite.git"
      VLLM_PROXY_SUITE_REF: "${VLLM_PROXY_SUITE_REF:-main}"

      VLLM_BASE_URL: "http://vllm:8001"
      VLLM_API_KEY: "${VLLM_API_KEY:-vllm}"
      VLLM_CC_PROXY_API_KEY: "${VLLM_CC_PROXY_API_KEY:-replace-with-a-long-random-key}"
      VLLM_OPENAI_PROXY_API_KEY: "${VLLM_OPENAI_PROXY_API_KEY:-replace-with-another-long-random-key}"

      DEFAULT_ENABLE_THINKING: "true"
      DEFAULT_MAX_TOKENS: "8192"

      MAX_RECOVERY_ATTEMPTS: "1"
      RECOVERY_TEMPERATURE_MAX: "0.45"
      RECOVERY_MAX_TOKENS: "4096"
      RECOVERY_NETWORK_TEMPERATURE_MAX: "0.30"
      RECOVERY_NETWORK_MAX_TOKENS: "1024"
      RECOVERY_NETWORK_LOOKUP_TOOL_NAMES: "${RECOVERY_NETWORK_LOOKUP_TOOL_NAMES:-}"
      RECOVERY_NETWORK_DOWNLOAD_TOOL_NAMES: "${RECOVERY_NETWORK_DOWNLOAD_TOOL_NAMES:-}"
      RECOVERY_NETWORK_HYBRID_TOOL_NAMES: "${RECOVERY_NETWORK_HYBRID_TOOL_NAMES:-}"

      CLAUDE_CODE_TOOL_RECOVERY_ENABLED: "${CLAUDE_CODE_TOOL_RECOVERY_ENABLED:-true}"
      CLAUDE_CODE_ACTION_INTENT_GUARD_ENABLED: "${CLAUDE_CODE_ACTION_INTENT_GUARD_ENABLED:-true}"
      CLAUDE_CODE_PLACEHOLDER_COMPLETION_GUARD_ENABLED: "${CLAUDE_CODE_PLACEHOLDER_COMPLETION_GUARD_ENABLED:-true}"
      CLAUDE_CODE_TOOL_INPUT_SCHEMA_GUARD_ENABLED: "${CLAUDE_CODE_TOOL_INPUT_SCHEMA_GUARD_ENABLED:-true}"
      CLAUDE_CODE_TARGETED_SCHEMA_CORRECTION_ENABLED: "${CLAUDE_CODE_TARGETED_SCHEMA_CORRECTION_ENABLED:-true}"
      CLAUDE_CODE_TOOL_STOP_REASON_NORMALIZATION_ENABLED: "${CLAUDE_CODE_TOOL_STOP_REASON_NORMALIZATION_ENABLED:-true}"
      CLAUDE_CODE_EDIT_RECOVERY_ENABLED: "${CLAUDE_CODE_EDIT_RECOVERY_ENABLED:-true}"
      CLAUDE_CODE_WRITE_RECOVERY_ENABLED: "${CLAUDE_CODE_WRITE_RECOVERY_ENABLED:-true}"
      CLAUDE_CODE_NOTEBOOK_EDIT_RECOVERY_ENABLED: "${CLAUDE_CODE_NOTEBOOK_EDIT_RECOVERY_ENABLED:-true}"
      CLAUDE_CODE_BASH_INVALIDATES_READS: "${CLAUDE_CODE_BASH_INVALIDATES_READS:-true}"

      CLAUDE_CODE_WEBSEARCH_BRIDGE_ENABLED: "${CLAUDE_CODE_WEBSEARCH_BRIDGE_ENABLED:-false}"
      CLAUDE_CODE_WEBSEARCH_TOOL_NAMES: "${CLAUDE_CODE_WEBSEARCH_TOOL_NAMES:-WebSearch}"
      CLAUDE_CODE_WEBFETCH_BRIDGE_ENABLED: "${CLAUDE_CODE_WEBFETCH_BRIDGE_ENABLED:-false}"
      CLAUDE_CODE_WEBFETCH_TOOL_NAMES: "${CLAUDE_CODE_WEBFETCH_TOOL_NAMES:-WebFetch}"
      MANAGED_WEB_TOOLS_THINK: "${MANAGED_WEB_TOOLS_THINK:-false}"
      MANAGED_WEB_TOOLS_MAX_BATCH: "${MANAGED_WEB_TOOLS_MAX_BATCH:-8}"
      MANAGED_WEB_STREAM_PROGRESS_MODE: "${MANAGED_WEB_STREAM_PROGRESS_MODE:-visible}"
      MANAGED_WEB_STREAM_PROGRESS_DETAIL: "${MANAGED_WEB_STREAM_PROGRESS_DETAIL:-query}"
      MANAGED_WEB_STREAM_PROGRESS_INTERVAL_MS: "${MANAGED_WEB_STREAM_PROGRESS_INTERVAL_MS:-5000}"
      MANAGED_WEB_STREAM_PROGRESS_MAX_LABEL_CHARS: "${MANAGED_WEB_STREAM_PROGRESS_MAX_LABEL_CHARS:-160}"
      MANAGED_WEB_STREAM_PROGRESS_MAX_DOTS: "${MANAGED_WEB_STREAM_PROGRESS_MAX_DOTS:-12}"
      WEBSEARCH_MAX_PARALLEL: "${WEBSEARCH_MAX_PARALLEL:-2}"
      WEBFETCH_MAX_PARALLEL: "${WEBFETCH_MAX_PARALLEL:-2}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      SEARXNG_API_KEY: "${SEARXNG_API_KEY:-}"
      SEARXNG_TIMEOUT_MS: "${SEARXNG_TIMEOUT_MS:-10000}"
      SEARXNG_MAX_USES: "${SEARXNG_MAX_USES:-5}"
      SEARXNG_MAX_RESULTS: "${SEARXNG_MAX_RESULTS:-8}"
      SEARXNG_MAX_RESULT_BYTES: "${SEARXNG_MAX_RESULT_BYTES:-16384}"
      SEARXNG_MAX_RESPONSE_BYTES: "${SEARXNG_MAX_RESPONSE_BYTES:-2097152}"
      SEARXNG_MAX_SNIPPET_CHARS: "${SEARXNG_MAX_SNIPPET_CHARS:-600}"
      SEARXNG_MAX_TITLE_CHARS: "${SEARXNG_MAX_TITLE_CHARS:-300}"
      SEARXNG_MAX_QUERY_CHARS: "${SEARXNG_MAX_QUERY_CHARS:-1024}"
      SEARXNG_LANGUAGE: "${SEARXNG_LANGUAGE:-all}"
      SEARXNG_CATEGORIES: "${SEARXNG_CATEGORIES:-general}"
      SEARXNG_SAFE_SEARCH: "${SEARXNG_SAFE_SEARCH:-0}"
      WEBFETCH_HTML_PROVIDER: "${WEBFETCH_HTML_PROVIDER:-internal}"
      WEBFETCH_PROBE_TIMEOUT_MS: "${WEBFETCH_PROBE_TIMEOUT_MS:-5000}"
      AWESOME_WEB_FETCH_BASE_URL: "${AWESOME_WEB_FETCH_BASE_URL:-http://awesome-web-fetch:3000}"
      AWESOME_WEB_FETCH_PATH: "${AWESOME_WEB_FETCH_PATH:-/}"
      AWESOME_WEB_FETCH_API_KEY: "${AWESOME_WEB_FETCH_API_KEY:-replace-with-a-long-random-sidecar-key}"
      AWESOME_WEB_FETCH_TIMEOUT_MS: "${AWESOME_WEB_FETCH_TIMEOUT_MS:-90000}"
      AWESOME_WEB_FETCH_MAX_RESPONSE_BYTES: "${AWESOME_WEB_FETCH_MAX_RESPONSE_BYTES:-8388608}"
      WEBFETCH_TIMEOUT_MS: "${WEBFETCH_TIMEOUT_MS:-20000}"
      WEBFETCH_MAX_USES: "${WEBFETCH_MAX_USES:-3}"
      WEBFETCH_MAX_REDIRECTS: "${WEBFETCH_MAX_REDIRECTS:-5}"
      WEBFETCH_MAX_DOWNLOAD_BYTES: "${WEBFETCH_MAX_DOWNLOAD_BYTES:-20971520}"
      WEBFETCH_MAX_EXTRACTED_CHARS: "${WEBFETCH_MAX_EXTRACTED_CHARS:-2000000}"
      WEBFETCH_MAX_PROMPT_CHARS: "${WEBFETCH_MAX_PROMPT_CHARS:-4000}"
      WEBFETCH_READER_CHUNK_CHARS: "${WEBFETCH_READER_CHUNK_CHARS:-18000}"
      WEBFETCH_READER_CHUNK_OVERLAP_CHARS: "${WEBFETCH_READER_CHUNK_OVERLAP_CHARS:-600}"
      WEBFETCH_READER_MAX_CHUNKS: "${WEBFETCH_READER_MAX_CHUNKS:-32}"
      WEBFETCH_PDF_PAGES_PER_CHUNK: "${WEBFETCH_PDF_PAGES_PER_CHUNK:-1}"
      WEBFETCH_PDF_MAX_PAGES: "${WEBFETCH_PDF_MAX_PAGES:-100}"
      WEBFETCH_PDF_EXTRACT_TIMEOUT_MS: "${WEBFETCH_PDF_EXTRACT_TIMEOUT_MS:-30000}"
      WEBFETCH_READER_MAX_TOKENS: "${WEBFETCH_READER_MAX_TOKENS:-800}"
      WEBFETCH_SYNTHESIS_MAX_TOKENS: "${WEBFETCH_SYNTHESIS_MAX_TOKENS:-1600}"
      WEBFETCH_SYNTHESIS_INPUT_MAX_CHARS: "${WEBFETCH_SYNTHESIS_INPUT_MAX_CHARS:-200000}"
      WEBFETCH_RESULT_MAX_BYTES: "${WEBFETCH_RESULT_MAX_BYTES:-65536}"
      WEBFETCH_MODEL_TIMEOUT_MS: "${WEBFETCH_MODEL_TIMEOUT_MS:-180000}"
      WEBFETCH_MODEL_RESPONSE_MAX_BYTES: "${WEBFETCH_MODEL_RESPONSE_MAX_BYTES:-1048576}"

      HEARTBEAT_INTERVAL_MS: "10000"
      UPSTREAM_IDLE_TIMEOUT_MS: "180000"
      SEMANTIC_STALL_TIMEOUT_MS: "300000"
      TOTAL_GENERATION_TIMEOUT_MS: "1800000"
      RECOVERY_TIMEOUT_MS: "900000"
      SHUTDOWN_GRACE_MS: "300000"

      MAX_ACTIVE_REQUESTS: "256"
      MAX_REQUEST_BODY_BYTES: "8388608"
      MAX_RESPONSE_BUFFER_BYTES: "33554432"
      MAX_TOTAL_BUFFERED_BYTES: "1073741824"
      MAX_THINKING_BYTES: "4194304"
      MAX_TOOL_ARGUMENT_BYTES: "8388608"
      MAX_CONTENT_BLOCKS: "256"
      MAX_TOOL_CALLS: "128"

      LOOP_MIN_PATTERN_SIZE: "24"
      LOOP_MAX_PATTERN_SIZE: "2048"
      LOOP_MIN_COUNT: "3"
      LOOP_REASONING_CHAR_LIMIT: "24000"
      LOOP_SCAN_INTERVAL_CHARS: "64"
      RESPONSES_UPSTREAM_MODE: "${VLLM_PROXY_RESPONSES_UPSTREAM_MODE:-native}"
      RESPONSES_BEHAVIOR_MODE: "${VLLM_PROXY_RESPONSES_BEHAVIOR_MODE:-transparent}"
      RESPONSES_TOOL_CHOICE_POLICY: "${VLLM_PROXY_RESPONSES_TOOL_CHOICE_POLICY:-preserve}"
      RESPONSES_HOSTED_TOOL_POLICY: "${VLLM_PROXY_RESPONSES_HOSTED_TOOL_POLICY:-drop_optional}"
      RESPONSES_MALFORMED_TOOL_RETRY_ENABLED: "${VLLM_PROXY_RESPONSES_MALFORMED_TOOL_RETRY_ENABLED:-true}"
      RESPONSES_MALFORMED_TOOL_RECOVERY_MIN_TOKENS: "${VLLM_PROXY_RESPONSES_MALFORMED_TOOL_RECOVERY_MIN_TOKENS:-1024}"
      RESPONSES_MALFORMED_TOOL_RECOVERY_TEMPERATURE_MAX: "${VLLM_PROXY_RESPONSES_MALFORMED_TOOL_RECOVERY_TEMPERATURE_MAX:-0.1}"
      ACTIONLESS_COMPLETION_GUARD_ENABLED: "${VLLM_PROXY_ACTIONLESS_COMPLETION_GUARD_ENABLED:-true}"
      LOG_LEVEL: "${VLLM_PROXY_LOG_LEVEL:-info}"
      LOG_FORMAT: "${VLLM_PROXY_LOG_FORMAT:-text}"
      PROGRESS_LOG_INTERVAL_MS: "${VLLM_PROXY_PROGRESS_LOG_INTERVAL_MS:-10000}"
      PROGRESS_STALL_WARNING_MS: "${VLLM_PROXY_PROGRESS_STALL_WARNING_MS:-30000}"
      LOG_TOOL_PAYLOADS: "${VLLM_PROXY_LOG_TOOL_PAYLOADS:-false}"
      LOG_TOOL_PAYLOAD_MAX_BYTES: "${VLLM_PROXY_LOG_TOOL_PAYLOAD_MAX_BYTES:-1024}"
      TOOL_ARGUMENT_WARNING_BYTES: "${VLLM_PROXY_TOOL_ARGUMENT_WARNING_BYTES:-8192}"
      TOOL_ARGUMENT_CRITICAL_BYTES: "${VLLM_PROXY_TOOL_ARGUMENT_CRITICAL_BYTES:-16384}"
      TOOL_PASSTHROUGH_OBSERVATION_MAX_BYTES: "${VLLM_PROXY_TOOL_PASSTHROUGH_OBSERVATION_MAX_BYTES:-65536}"
      TOOL_CORRELATION_TTL_MS: "${VLLM_PROXY_TOOL_CORRELATION_TTL_MS:-900000}"
      TOOL_CORRELATION_MAX_ENTRIES: "${VLLM_PROXY_TOOL_CORRELATION_MAX_ENTRIES:-10000}"
      CLIENT_RETRY_FINGERPRINT_TTL_MS: "${VLLM_PROXY_CLIENT_RETRY_FINGERPRINT_TTL_MS:-900000}"
      CLIENT_RETRY_FINGERPRINT_MAX_ENTRIES: "${VLLM_PROXY_CLIENT_RETRY_FINGERPRINT_MAX_ENTRIES:-10000}"
    volumes:
      - vllm-proxy-suite:/app
    command: >
      sh -ec "
        apk add --no-cache git su-exec poppler-utils &&
        if [ ! -d /app/.git ]; then
          find /app -mindepth 1 -maxdepth 1 -exec rm -rf {} + &&
          git clone --depth 1 --branch "$${VLLM_PROXY_SUITE_REF}" "$${VLLM_PROXY_SUITE_REPOSITORY}" /app;
        else
          git -c safe.directory=/app -C /app remote set-url origin "$${VLLM_PROXY_SUITE_REPOSITORY}" &&
          git -c safe.directory=/app -C /app fetch --force --prune origin "$${VLLM_PROXY_SUITE_REF}" &&
          git -c safe.directory=/app -C /app reset --hard FETCH_HEAD &&
          git -c safe.directory=/app -C /app clean -fdx;
        fi &&
        chown -R node:node /app &&
        exec su-exec node node /app/vllm-proxy-suite.js
      "
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3456/health/ready')
          .then((response)=>process.exit(response.ok?0:1))
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - vllm-test-network

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    container_name: searxng
    profiles:
      - websearch
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
      SEARXNG_LIMITER: "false"
      SEARXNG_IMAGE_PROXY: "false"
      FORCE_OWNERSHIP: "true"
    volumes:
      - searxng-config:/etc/searxng
      - searxng-data:/var/cache/searxng
    entrypoint:
      - /bin/sh
      - -ec
      - |
          if [ ! -s /etc/searxng/settings.yml ]; then
            secret_yaml="$$(python -c 'import json, os, secrets; print(json.dumps(os.environ.get("SEARXNG_SECRET") or secrets.token_urlsafe(48)))')"
            printf '%s\n' \
              'use_default_settings: true' \
              'search:' \
              '  formats:' \
              '    - html' \
              '    - json' \
              'server:' \
              "  secret_key: $$secret_yaml" \
              '  limiter: false' \
              '  image_proxy: false' \
              > /etc/searxng/settings.yml
          fi
          exec /usr/local/searxng/entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read(1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - vllm-test-network
  awesome-web-fetch:
    build:
      context: "${AWESOME_WEB_FETCH_BUILD_CONTEXT:-https://github.com/ericli1018/awesome-web-fetch.git#main}"
    image: "${AWESOME_WEB_FETCH_IMAGE:-awesome-web-fetch:local}"
    container_name: awesome-web-fetch
    profiles:
      - webfetch-browser
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    shm_size: "1gb"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      API_KEY: "${AWESOME_WEB_FETCH_API_KEY:-replace-with-a-long-random-sidecar-key}"
      BATCH_SIZE: "${AWESOME_WEB_FETCH_BATCH_SIZE:-3}"
      MAX_CHARS: "${AWESOME_WEB_FETCH_MAX_CHARS:-2000000}"
      GOTO_TIMEOUT: "${AWESOME_WEB_FETCH_GOTO_TIMEOUT:-20000}"
      WAIT_TIMEOUT: "${AWESOME_WEB_FETCH_WAIT_TIMEOUT:-5000}"
      FETCH_TIMEOUT: "${AWESOME_WEB_FETCH_FETCH_TIMEOUT:-30000}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/')
          .then((response)=>process.exit(response.ok?0:1))
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - vllm-test-network

